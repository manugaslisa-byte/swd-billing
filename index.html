<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SWD Portable Billing</title>

  <!-- Makes the page installable as an app (home-screen icon, full screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a4a7c">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Every screen is drawn into this one element by js/app.js -->
  <div id="app"></div>

  <!-- Load order matters: data first, screens, then the starter -->
  <script src="js/storage.js"></script>   <!-- data model, saving, backup -->
  <script src="js/billing.js"></script>   <!-- rates, bill computation, payments, turn-over, deposit -->
  <script src="js/printer.js"></script>   <!-- 58 mm bill/receipt text + Bluetooth printing -->
  <script src="js/csv.js"></script>       <!-- bulk upload of customers -->
  <script src="js/views.js"></script>     <!-- the screens -->
  <script src="js/app.js"></script>       <!-- login, navigation, start-up -->
</body>
</html>
