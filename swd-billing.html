<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWD Portable Billing</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#10243a;--mut:#58697b;--pri:#0a4a7c;--pri2:#e3eef8;--bd:#cfdae6;--red:#c9302c;--ok:#17803f;--mono:ui-monospace,"Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141d;--card:#142230;--ink:#e6eef6;--mut:#93a5b6;--pri:#5fb0ef;--pri2:#1b3347;--bd:#27405a;--red:#ff7a72;--ok:#4cc27b}}
:root[data-theme="dark"]{--bg:#0b141d;--card:#142230;--ink:#e6eef6;--mut:#93a5b6;--pri:#5fb0ef;--pri2:#1b3347;--bd:#27405a;--red:#ff7a72;--ok:#4cc27b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{color:var(--ink)}
header b{font-size:17px}header small{display:block;opacity:.8}header button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:6px 10px}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--mut);padding:12px 14px;font:inherit;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--pri);border-color:var(--red);font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
label{display:block;margin:8px 0;color:var(--mut);font-size:13px}
input,select{width:100%;padding:10px;margin-top:3px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button.p,button.s{padding:11px 16px;border-radius:6px;font:inherit;font-weight:600;border:1px solid var(--pri);margin:8px 8px 0 0}
button.p{background:var(--pri);color:#fff}:root[data-theme="dark"] button.p{color:#06121c}button.s{background:transparent;color:var(--pri)}
:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{border-left:4px solid var(--pri);padding:6px 12px;background:var(--pri2);border-radius:4px}.st b{font-size:22px;display:block}.st span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut)}
pre{font:13px/1.3 var(--mono);background:#fff;color:#111;border:1px dashed #777;padding:12px;width:fit-content;max-width:100%;overflow-x:auto;margin:8px 0}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--pri2)}.Paid{color:var(--ok)}.Unpaid{color:var(--red)}
.big{font-size:26px;font-weight:700;color:var(--red)}.mut{color:var(--mut)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#06121c}}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px}.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#login{max-width:340px;margin:12vh auto;padding:0 14px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),addD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fd=d=>{const[y,m,k]=d.split('-');return m+'/'+k+'/'+y.slice(2)},r2=n=>Math.round(n*100)/100,m2=n=>r2(n).toFixed(2);
const def={cust:[{acct:'081-102-003',name:'DELA CRUZ, JUAN',addr:'DATU TANGKILAN, SINDANGAN',meter:'14120293',size:'1/2',last:2760},{acct:'061-102-347',name:'SANTOS, MARIA',addr:'SINDANGAN, ZN',meter:'14060207',size:'1/2',last:436}],bills:[],pays:[],cfg:{min:154,minCu:10,tiers:[{w:10,r:17.5},{w:10,r:19.5},{w:10,r:22},{w:1e9,r:25}],pen:10,dueDays:20,discDays:28,nb:112,nr:1}};
let S,U,tab='dash',cur=null,rp='',rt='b',ch=null;
let DB=null;
try{S=JSON.parse(localStorage.getItem('swd2'))}catch(e){}S=S||JSON.parse(JSON.stringify(def));
const save=()=>{try{localStorage.setItem('swd2',JSON.stringify(S))}catch(e){}};
const put=(c,id,o)=>{save();if(DB)DB.doc(c+'/'+id).set(JSON.parse(JSON.stringify(o))).catch(e=>alert('Could not save to the shared database ('+(e&&e.code||e)+'). You may only have view access.'))};
const refresh=()=>{if(!U)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;if(['#pr','#tn'].some(i=>$(i)&&$(i).value))return;render()};
const users={admin:['admin123','Administrator','admin'],reader:['reader123','Meter Reader','reader'],cashier:['cashier123','Cashier','cashier']};
const rn={reader:'Meter Reader',cashier:'Cashier',admin:'Administrator'};let selRole='reader';
function setRole(r){const u=$('#u')?$('#u').value:'';selRole=r;render();$('#u').value=u}
const roles={admin:['dash','cust','read','pay','rec','set'],reader:['dash','cust','read','rec'],cashier:['dash','pay','rec']};
const nm={dash:'Dashboard',cust:'Customers',read:'Meter Reading',pay:'Payments',rec:'Records',set:'Settings'};
function calc(cu){const c=S.cfg;let a=c.min,r=Math.max(0,cu-c.minCu);for(const q of c.tiers){const x=Math.min(r,q.w);a+=x*q.r;r-=x;if(r<=0)break}return r2(a)}
const rem=(b,d)=>Math.max(0,r2((d>b.due?b.late:b.total)-b.paid)),open=a=>S.bills.find(b=>b.acct==a&&(b.st=='Unpaid'||b.st=='Partial'));
const cu_=a=>S.cust.find(c=>c.acct==a);
/* ---- 58mm thermal text ---- */
const W=32,ctr=s=>' '.repeat(Math.max(0,(W-s.length)>>1))+s,row=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b,hr='-'.repeat(W);
const wr=t=>t.replace(/(.{1,32})(\s+|$)/g,'$1\n').trim();
function billText(b){const c=cu_(b.acct),k=S.cfg,mn=Math.min(b.am,k.min),ex=r2(b.am-mn);const L=[ctr('SINDANGAN WATER DISTRICT'),ctr('Provincial Road, Magsaysay,'),ctr('Sindangan, Zamboanga del Norte'),ctr('(65) 224-2324 | NON-VAT'),ctr('TIN 004-315-466-00000'),hr,ctr('BILLING NOTICE'),ctr('No. '+b.no),hr,wr('NAME: '+c.name),wr('ADDR: '+c.addr),'ACCOUNT NO.: '+b.acct,'METER NO.: '+c.meter,'PERIOD COVERED:',fd(b.from)+' TO '+fd(b.rd),hr,'COMPUTATION:',row('READING DATE:',fd(b.rd)),row('PRESENT READING:',''+b.cur),row('PREVIOUS READING:',''+b.prev),hr,row('AMOUNT:',m2(b.am)),row('Minimum:',m2(mn))];if(ex>0)L.push(row('Excess ('+Math.max(0,b.cu-k.minCu)+' cu.m):',m2(ex)));L.push(row('ADJUSTMENT:','0.00'),row('ARREARS:',m2(b.ar)),'OTHERS:',hr,row('TOTAL:',m2(b.total)),hr,row('DUE DATE:',fd(b.due)),row('DISCONNECTION DATE:',fd(b.disc)),row('CONSUMPTION (cu.m.):',''+b.cu),hr,'AMOUNT DUE IF PAID',row('ON OR BEFORE DUE DATE:',m2(b.total)),'AMOUNT DUE IF PAID',row('AFTER DUE DATE:',m2(b.late)),hr,'This document is not valid for','claim of input tax.','Read by: '+b.by,'Pay at the SWD Office only.');return L.join('\n')}
function rcpText(p){const b=S.bills.find(x=>x.no==p.bill),c=cu_(p.acct),d=new Date(p.dt);return[ctr('SINDANGAN WATER DISTRICT'),ctr('OFFICIAL RECEIPT'),hr,'OR No: '+p.or,'Date: '+d.toLocaleString('en-US'),'Received from:',c.name,'Account: '+p.acct,'Bill No: '+p.bill,hr,row('Current billing',m2(b.am)),row('Arrears',m2(b.ar)),row('Amount due',m2(p.bd)),row('Amount paid',m2(p.amt)),row('Tendered',m2(p.tn)),row('Change',m2(p.ch)),row('Balance',m2(p.bal)),hr,'Cashier: '+p.by,ctr('Thank you!')].join('\n')}
/* ---- Bluetooth ---- */
async function conn(){try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']});const sv=await d.gatt.connect();for(const s of await sv.getPrimaryServices())for(const c of await s.getCharacteristics())if(c.properties.write||c.properties.writeWithoutResponse){ch=c;$('#ps').textContent='Connected: '+d.name;return}throw'No writable printer channel found'}catch(e){alert('Printer: '+e+'\n\nUse Chrome on Android with Bluetooth on, and open this page directly (not inside a frame).')}}
async function btPrint(){if(!ch)await conn();if(!ch)return;const b=new TextEncoder().encode('\x1b@'+$('#pt').textContent+'\n\n\n\n');for(let i=0;i<b.length;i+=100){const x=b.slice(i,i+100);await(ch.properties.writeWithoutResponse?ch.writeValueWithoutResponse(x):ch.writeValue(x))}$('#ps').textContent='Printed.'}
function bPrint(){const w=open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write('<pre style="font:12px monospace;width:58mm">'+esc($('#pt').textContent)+'</pre>');w.document.close();w.print()}
const pc=t=>`<div class="card"><h3>Print preview (58 mm)</h3><pre id="pt">${esc(t)}</pre><button class="p" onclick="btPrint()">Print via Bluetooth</button><button class="s" onclick="conn()">Connect printer</button><button class="s" onclick="bPrint()">Browser print</button> <span id="ps" class="mut"></span></div>`;
/* ---- views ---- */
const V={};
V.dash=()=>{const o=S.bills.filter(b=>b.st=='Unpaid'||b.st=='Partial'),tot=o.reduce((s,b)=>s+rem(b,today()),0),col=S.pays.reduce((s,p)=>s+p.amt,0);return`<div class="g"><div class="st"><b>${S.cust.length}</b><span>Customers</span></div><div class="st"><b>${S.bills.length}</b><span>Bills generated</span></div><div class="st"><b>${o.length}</b><span>Outstanding bills</span></div><div class="st"><b>${m2(tot)}</b><span>Outstanding (PHP)</span></div><div class="st"><b>${m2(col)}</b><span>Collected (PHP)</span></div></div><div class="card" style="margin-top:14px"><h3>Workflow</h3><p>Meter reader records the reading and prints the bill on site. The customer pays at the district office, where the cashier records the payment and prints the receipt. Meter readers never collect payments.</p></div>`};
V.cust=()=>`${U.r=='admin'?`<div class="card"><h3>Add customer</h3><div class="g"><label>Account no.<input id="a1" placeholder="081-102-003"></label><label>Name<input id="a2" placeholder="LAST, FIRST"></label><label>Service address<input id="a3"></label><label>Meter no.<input id="a4"></label><label>Meter size<input id="a5" value="1/2"></label><label>Initial reading<input id="a6" type="number" value="0"></label></div><button class="p" onclick="addC()">Save customer</button></div>`:''}<div class="card"><h3>Customer records</h3><input placeholder="Search name or account" oninput="fl(this.value)"><div class="tw"><table><tr><th>Account</th><th>Name</th><th>Address</th><th>Meter</th><th>Last reading</th></tr>${S.cust.map(c=>`<tr data-k="${esc((c.acct+c.name).toLowerCase())}"><td>${esc(c.acct)}</td><td>${esc(c.name)}</td><td>${esc(c.addr)}</td><td>${esc(c.meter)}</td><td>${c.last}</td></tr>`).join('')}</table></div></div>`;
const fl=v=>document.querySelectorAll('tr[data-k]').forEach(r=>r.style.display=r.dataset.k.includes(v.toLowerCase())?'':'none');
function addC(){const v=[1,2,3,4,5,6].map(i=>$('#a'+i).value.trim());if(!v[0]||!v[1]||!v[3])return alert('Account no., name and meter no. are required.');if(cu_(v[0]))return alert('That account number already exists.');S.cust.push({acct:v[0],name:v[1].toUpperCase(),addr:v[2].toUpperCase(),meter:v[3],size:v[4],last:+v[5]||0});put('customers',v[0],S.cust[S.cust.length-1]);render()}
const dl=()=>`<datalist id="cl">${S.cust.map(x=>`<option value="${esc(x.acct)}">${esc(x.name)}</option>`).join('')}</datalist>`;
function pick(v){const c=S.cust.find(x=>x.acct==v||x.name.toLowerCase()==v.toLowerCase());cur=c?{acct:c.acct}:null;if(!c)alert('Customer not found.');render()}
V.read=()=>{const c=cur&&cu_(cur.acct);return`<div class="card"><h3>Meter reading</h3><input list="cl" placeholder="Account no. or name" onchange="pick(this.value)" value="${c?esc(c.acct):''}">${dl()}${c?`<p><b>${esc(c.name)}</b><br>${esc(c.addr)}<br>Meter ${esc(c.meter)} | Previous reading: <b>${c.last}</b></p><label>Present reading<input id="pr" type="number" min="0" inputmode="numeric" oninput="pv()"></label><label>Reading date<input id="rd" type="date" value="${today()}"></label><p id="pv" class="mut"></p><button class="p" onclick="gen()">Generate bill</button>`:''}</div>${cur&&cur.bill?pc(billText(cur.bill)):''}`};
function pv(){const c=cu_(cur.acct),p=+$('#pr').value,u=Math.max(0,p-c.last);$('#pv').innerHTML=$('#pr').value===''?'':`Consumption <b>${u} cu.m</b> | Amount <b>PHP ${m2(calc(u))}</b>`}
function gen(){const c=cu_(cur.acct),k=S.cfg,p=+$('#pr').value,rd=$('#rd').value;if($('#pr').value===''||!rd)return alert('Enter the present reading and the reading date.');if(p<c.last&&!confirm('Present reading is lower than the previous one. Continue (meter replaced or reset)?'))return;const u=Math.max(0,p-c.last),o=open(c.acct),ar=o?rem(o,rd):0;if(o)o.st='Rolled';const am=calc(u),t=r2(am+ar),nn=Math.max(k.nb,...S.bills.map(x=>+x.no+1)),pb=S.bills.filter(x=>x.acct==c.acct).pop();const b={no:String(nn).padStart(7,'0'),acct:c.acct,from:pb?pb.rd:addD(rd,-30),rd,prev:c.last,cur:p,cu:u,am,ar,total:t,late:r2(t*(1+k.pen/100)),due:addD(rd,k.dueDays),disc:addD(rd,k.discDays),paid:0,st:'Unpaid',by:U.n};k.nb=nn+1;c.last=p;S.bills.push(b);put('bills',b.no,b);if(o)put('bills',o.no,o);put('customers',c.acct,c);put('config','main',k);cur={acct:c.acct,bill:b};render()}
V.pay=()=>{const c=cur&&cu_(cur.acct),b=c&&open(c.acct);return`<div class="card"><h3>Record payment (office)</h3><input list="cl" placeholder="Account no. or name" onchange="pick(this.value)" value="${c?esc(c.acct):''}">${dl()}${c?(b?`<p><b>${esc(c.name)}</b><br>Bill ${b.no} | Due ${fd(b.due)}</p><div class="mut">Amount due today</div><div class="big">PHP ${m2(rem(b,today()))}</div><p class="mut">Current ${m2(b.am)} + arrears ${m2(b.ar)}${today()>b.due?' + late charge':''}</p><label>Amount tendered<input id="tn" type="number" step="0.01" inputmode="decimal"></label><button class="p" onclick="pay()">Record payment and receipt</button>`:`<p>${esc(c.name)} has no outstanding bill.</p>`):''}</div>${cur&&cur.rc?pc(rcpText(cur.rc)):''}`};
function pay(){const b=open(cur.acct),t=+$('#tn').value,d=today(),due=rem(b,d);if(!(t>0))return alert('Enter the amount tendered.');const ap=Math.min(t,due);b.paid=r2(b.paid+ap);const bal=rem(b,d);b.st=bal<=0?'Paid':'Partial';const nr=Math.max(S.cfg.nr,...S.pays.map(x=>+x.or+1));S.cfg.nr=nr+1;const p={or:String(nr).padStart(6,'0'),acct:b.acct,bill:b.no,amt:ap,tn:t,ch:r2(t-ap),dt:new Date().toISOString(),by:U.n,bal,bd:due};S.pays.push(p);put('payments',p.or,p);put('bills',b.no,b);put('config','main',S.cfg);cur={acct:b.acct,rc:p};render()}
V.rec=()=>`${rp?pc(rp):''}<div class="card"><h3>Records</h3><button class="${rt=='b'?'p':'s'}" onclick="rt='b';render()">Bills</button><button class="${rt=='p'?'p':'s'}" onclick="rt='p';render()">Payments</button><input style="margin-top:10px" placeholder="Search account" oninput="fl(this.value)"><div class="tw">${rt=='b'?`<table><tr><th>Bill</th><th>Account</th><th>Date</th><th>Cu.m</th><th>Total</th><th>Status</th><th></th></tr>${S.bills.slice().reverse().map(b=>`<tr data-k="${b.acct}${esc(((cu_(b.acct)||{}).name||'').toLowerCase())}"><td>${b.no}</td><td>${b.acct}</td><td>${fd(b.rd)}</td><td>${b.cu}</td><td>${m2(b.total)}</td><td class="${b.st}">${b.st}</td><td><button class="s" style="margin:0;padding:4px 8px" onclick="rp=billText(S.bills.find(x=>x.no=='${b.no}'));render();scrollTo(0,0)">Reprint</button></td></tr>`).join('')}</table>`:`<table><tr><th>OR</th><th>Account</th><th>Date</th><th>Paid</th><th>Balance</th><th>Cashier</th><th></th></tr>${S.pays.slice().reverse().map(p=>`<tr data-k="${p.acct}"><td>${p.or}</td><td>${p.acct}</td><td>${fd(p.dt.slice(0,10))}</td><td>${m2(p.amt)}</td><td>${m2(p.bal)}</td><td>${esc(p.by)}</td><td><button class="s" style="margin:0;padding:4px 8px" onclick="rp=rcpText(S.pays.find(x=>x.or=='${p.or}'));render();scrollTo(0,0)">Reprint</button></td></tr>`).join('')}</table>`}</div></div>`;
V.set=()=>{const k=S.cfg;return`<div class="card"><h3>Billing rates</h3><p class="mut">Placeholder values. Replace them with the district's official rates; the system does not set rates.</p><div class="g"><label>Minimum charge (PHP)<input id="s1" type="number" value="${k.min}"></label><label>Minimum covers (cu.m)<input id="s2" type="number" value="${k.minCu}"></label>${k.tiers.map((t,i)=>`<label>Tier ${i+1} rate/cu.m${i<3?' (next '+t.w+' cu.m)':' (above)'}<input id="t${i}" type="number" step="0.01" value="${t.r}"></label>`).join('')}<label>Late charge (%)<input id="s3" type="number" value="${k.pen}"></label><label>Due after (days)<input id="s4" type="number" value="${k.dueDays}"></label><label>Disconnection after (days)<input id="s5" type="number" value="${k.discDays}"></label></div><button class="p" onclick="setC()">Save rates</button></div>`};
function setC(){const k=S.cfg;k.min=+$('#s1').value;k.minCu=+$('#s2').value;k.tiers.forEach((t,i)=>t.r=+$('#t'+i).value);k.pen=+$('#s3').value;k.dueDays=+$('#s4').value;k.discDays=+$('#s5').value;put('config','main',k);alert('Rates saved.')}
function go(t){tab=t;cur=null;rp='';render()}
function login(){const u=$('#u').value.trim().toLowerCase(),x=users[u];if(!x||x[0]!=$('#w').value)return alert('Wrong username or password.');if(x[2]!=selRole)return alert('This account is not a '+rn[selRole]+' account. Choose the correct role above.');U={r:x[2],n:x[1]};render()}
function render(){if(!U){$('#app').innerHTML=`<div id="login" class="card"><h3>SWD Portable Billing</h3><p class="mut">Sindangan Water District. Sign in as:</p><div class="seg">${Object.keys(rn).map(k=>`<button class="${k==selRole?'on':''}" onclick="setRole('${k}')">${rn[k]}</button>`).join('')}</div><label>Username<input id="u" autocomplete="off"></label><label>Password<input id="w" type="password"></label><button class="p" onclick="login()">Log in</button><p class="mut" style="font-size:12px">Demo for ${rn[selRole]}: ${selRole} / ${users[selRole][0]}</p></div>`;return}
$('#app').innerHTML=`<header><div><b>Sindangan Water District</b><small>${esc(U.n)} | ${DB?'Shared online':'This device only'}</small></div><button onclick="U=null;render()">Log out</button></header><nav>${roles[U.r].map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${nm[t]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
render();
(async()=>{try{const d=window.claude&&await claude.use('db');if(!d)return;DB=d;const sub=(n,f)=>DB.collection(n).onSnapshot(q=>{f(q.docs.map(x=>x.data()));save();refresh()},e=>console.error(e));
sub('customers',a=>S.cust=a.sort((x,y)=>x.acct<y.acct?-1:1));sub('bills',a=>S.bills=a.sort((x,y)=>x.no<y.no?-1:1));sub('payments',a=>S.pays=a.sort((x,y)=>x.or<y.or?-1:1));
DB.doc('config/main').onSnapshot(q=>{if(q.exists)S.cfg=q.data();refresh()},e=>console.error(e))}catch(e){}})();
</script></body></html>
